apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release signing policy:
// - RELEASE_STORE_FILE (+ RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD) -> release keystore.
// - Otherwise the debug keystore is used ONLY when explicitly allowed via
//   DEVWOLF_ALLOW_DEBUG_SIGNING=true or -PallowDebugSigning=true (e.g. to stay update-compatible
//   with APKs previously signed with the local debug key). Without either, release packaging fails.
def releaseStorePath = System.getenv("RELEASE_STORE_FILE")
def hasReleaseKeystore = releaseStorePath != null && !releaseStorePath.trim().isEmpty() && file(releaseStorePath).exists()
def allowDebugSigning = (System.getenv("DEVWOLF_ALLOW_DEBUG_SIGNING") ?: project.findProperty("allowDebugSigning") ?: "false").toString().toBoolean()

android {
    namespace = "com.devwolf.downloader"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.devwolf.downloader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 30007
        versionName "3.0.0-rc.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk true
        }
    }

    signingConfigs {
        releaseCustom {
            if (hasReleaseKeystore) {
                storeFile file(releaseStorePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.releaseCustom
            } else if (allowDebugSigning) {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

def youtubedlAndroidVersion = '0.18.1'

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.work:work-runtime-ktx:2.10.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jsoup:jsoup:1.18.3"

    // Local yt-dlp + FFmpeg + aria2c engine
    implementation "io.github.junkfood02.youtubedl-android:library:$youtubedlAndroidVersion"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$youtubedlAndroidVersion"
    implementation "io.github.junkfood02.youtubedl-android:aria2c:$youtubedlAndroidVersion"

    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}

gradle.taskGraph.whenReady { graph ->
    if (hasReleaseKeystore || allowDebugSigning) return
    def releasePackaging = graph.allTasks.any { task ->
        task.project == project &&
            task.name.toLowerCase().contains("release") &&
            (task.name.startsWith("assemble") || task.name.startsWith("bundle") || task.name.startsWith("package"))
    }
    if (releasePackaging) {
        throw new GradleException(
            "Build release sem keystore: defina RELEASE_STORE_FILE/RELEASE_STORE_PASSWORD/RELEASE_KEY_ALIAS/RELEASE_KEY_PASSWORD " +
                "ou permita explicitamente a chave de debug com DEVWOLF_ALLOW_DEBUG_SIGNING=true (ou -PallowDebugSigning=true)."
        )
    }
}
