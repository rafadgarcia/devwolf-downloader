name: Devwolf Downloader CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  frontend-build-and-test:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  android-apk:
    name: Android APK (Gradle + R8 + ABI Splits)
    runs-on: ubuntu-latest
    needs: [frontend-build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend deps & sync Capacitor Android
        run: |
          cd frontend
          npm ci
          npx cap sync android

      - name: Run Android Unit Tests & Build APKs (arm64-v8a + universal)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon
        env:
          # CI artifacts are test builds: explicitly allow the debug key when no release keystore secret exists.
          DEVWOLF_ALLOW_DEBUG_SIGNING: "true"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devwolf-downloader-apks
          path: android/app/build/outputs/apk/**/*.apk
