# Configuração de roteamento por domínio e tipo de mídia — Devwolf Downloader
# Regras:
# - Validação estrita por hostname (exato ou subdomínio listado), nunca por substring.
# - Nenhum extractor genérico indiscriminado para domínios desconhecidos.
# - Ordem de motores define primário + fallbacks para falhas técnicas recuperáveis.

version: 1

limits:
  max_redirect_hops: 5
  max_carousel_items: 50

tracking_params_strip:
  - igsh
  - igshid
  - utm_source
  - utm_medium
  - utm_campaign
  - utm_term
  - utm_content
  - utm_id
  - utm_name
  - fbclid
  - si
  - feature
  - ref
  - ref_src
  - ref_url
  - sender_device
  - is_from_webapp
  - _r
  - _t
  - share_id

# Parâmetros essenciais preservados explicitamente (documentação/referência)
preserved_params:
  - v
  - t
  - list
  - index
  - story_fbid
  - id
  - fbid
  - set

short_domains:
  youtu.be: youtube
  instagr.am: instagram
  vm.tiktok.com: tiktok
  vt.tiktok.com: tiktok
  t.co: twitter
  fb.watch: facebook
  redd.it: reddit
  pin.it: pinterest

routes:
  - id: instagram_reel
    platform: instagram
    label: Instagram Reel
    domains:
      - instagram.com
      - www.instagram.com
      - m.instagram.com
      - instagr.am
    path_prefixes:
      - /reel/
      - /reels/
    media_types:
      - video
    primary_engine: yt-dlp
    fallback_engines:
      - gallery-dl
      - cobalt
    experimental: false
    allow_playlists: false

  - id: instagram_post
    platform: instagram
    label: Instagram Post / TV
    domains:
      - instagram.com
      - www.instagram.com
      - m.instagram.com
      - instagr.am
    path_prefixes:
      - /p/
      - /tv/
    media_types:
      - image
      - carousel
      - video
    primary_engine: gallery-dl
    fallback_engines:
      - cobalt
      - yt-dlp
    engine_constraints:
      yt-dlp:
        video_only: true
    experimental: false
    allow_playlists: false

  - id: instagram_stories
    platform: instagram
    label: Instagram Stories (experimental)
    domains:
      - instagram.com
      - www.instagram.com
      - m.instagram.com
    path_prefixes:
      - /stories/
    media_types:
      - image
      - video
    primary_engine: gallery-dl
    fallback_engines: []
    experimental: true
    public_only: true
    allow_playlists: false

  - id: youtube
    platform: youtube
    label: YouTube
    domains:
      - youtube.com
      - www.youtube.com
      - m.youtube.com
      - music.youtube.com
      - youtu.be
    path_prefixes:
      - /watch
      - /shorts/
      - /live/
      - /embed/
      - /
    disallow_path_prefixes:
      - /playlist
      - /channel/
      - /c/
      - /@
      - /feed/
      - /results
    media_types:
      - video
      - audio
    primary_engine: yt-dlp
    fallback_engines:
      - cobalt
    experimental: false
    allow_playlists: false

  - id: tiktok
    platform: tiktok
    label: TikTok
    domains:
      - tiktok.com
      - www.tiktok.com
      - m.tiktok.com
      - vm.tiktok.com
      - vt.tiktok.com
    path_prefixes:
      - /
    media_types:
      - video
      - image
      - carousel
    primary_engine: cobalt
    fallback_engines:
      - yt-dlp
      - gallery-dl
    experimental: false
    allow_playlists: false

  - id: twitter
    platform: twitter
    label: X / Twitter
    domains:
      - x.com
      - www.x.com
      - mobile.x.com
      - twitter.com
      - www.twitter.com
      - mobile.twitter.com
      - t.co
    path_prefixes:
      - /
    media_types:
      - image
      - carousel
      - video
    primary_engine: gallery-dl
    fallback_engines:
      - cobalt
      - yt-dlp
    engine_constraints:
      yt-dlp:
        video_only: true
    experimental: false
    allow_playlists: false

  - id: facebook_reel
    platform: facebook
    label: Facebook Reel
    domains:
      - facebook.com
      - www.facebook.com
      - m.facebook.com
      - web.facebook.com
    path_prefixes:
      - /reel/
      - /share/r/
    media_types:
      - video
    primary_engine: yt-dlp
    fallback_engines:
      - cobalt
    experimental: false
    allow_playlists: false

  - id: facebook
    platform: facebook
    label: Facebook
    domains:
      - facebook.com
      - www.facebook.com
      - m.facebook.com
      - web.facebook.com
      - fb.watch
    path_prefixes:
      - /share/v/
      - /watch
      - /videos/
      - /
    media_types:
      - video
    primary_engine: yt-dlp
    fallback_engines:
      - cobalt
    experimental: false
    allow_playlists: false

  - id: reddit
    platform: reddit
    label: Reddit
    domains:
      - reddit.com
      - www.reddit.com
      - old.reddit.com
      - new.reddit.com
      - redd.it
      - v.redd.it
    path_prefixes:
      - /
    media_types:
      - video
      - image
      - carousel
    primary_engine: yt-dlp
    fallback_engines:
      - cobalt
      - gallery-dl
    experimental: false
    allow_playlists: false

  - id: pinterest
    platform: pinterest
    label: Pinterest
    domains:
      - pinterest.com
      - www.pinterest.com
      - br.pinterest.com
      - pin.it
    path_prefixes:
      - /
    media_types:
      - image
      - video
    primary_engine: gallery-dl
    fallback_engines:
      - cobalt
      - yt-dlp
    engine_constraints:
      yt-dlp:
        video_only: true
    experimental: false
    allow_playlists: false
